<style>
:root{--red:#c0000a;--dark-red:#8a0007;--gold:#f5c800;--bg:#1a1a1a;--card:#252525;--text:#f0f0f0;--muted:#999;--green:#2ecc71;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl;}
#login-screen{position:fixed;inset:0;z-index:999;background:radial-gradient(ellipse at center,#1f1f1f,#0d0d0d);display:none;align-items:center;justify-content:center;}
.login-box{background:var(--card);border:1px solid rgba(245,200,0,.25);border-radius:20px;padding:40px 36px;width:100%;max-width:400px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.8);}
.login-ball{font-size:3rem;margin-bottom:10px;}
.login-logo{font-family:'Rubik',sans-serif;font-weight:900;font-size:2.4rem;color:var(--gold);margin-bottom:4px;}
.login-sub{color:var(--muted);font-size:.88rem;margin-bottom:24px;}
.login-label{text-align:right;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:700;}
.login-input{width:100%;background:#111;border:1.5px solid #444;color:var(--text);font-family:'Heebo',sans-serif;font-size:1rem;padding:12px 16px;border-radius:10px;margin-bottom:14px;text-align:right;direction:rtl;transition:border-color .2s;}
.login-input:focus{outline:none;border-color:var(--gold);}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--dark-red),var(--red));color:#fff;font-family:'Heebo',sans-serif;font-size:1.1rem;font-weight:900;border:none;border-radius:10px;cursor:pointer;}
.login-error{color:#ff6b6b;font-size:.88rem;margin-top:12px;min-height:20px;font-weight:700;}
header{background:linear-gradient(135deg,var(--dark-red),var(--red),#a00008);padding:0 16px;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.5);}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 0;gap:10px;flex-wrap:wrap;}
.logo-text{font-family:'Rubik',sans-serif;font-weight:900;font-size:1.7rem;color:var(--gold);line-height:1;}
.logo-sub{font-size:.6rem;color:rgba(255,255,255,.6);}
.user-badge{display:none;align-items:center;gap:8px;background:rgba(0,0,0,.25);border-radius:30px;padding:5px 12px 5px 8px;}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#000;font-weight:900;font-size:.95rem;display:flex;align-items:center;justify-content:center;}
.logout-btn{background:rgba(255,255,255,.15);border:none;color:rgba(255,255,255,.75);font-size:.75rem;font-family:'Heebo',sans-serif;padding:3px 9px;border-radius:20px;cursor:pointer;}
nav{display:flex;gap:3px;flex-wrap:wrap;}
nav button{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.15);color:#fff;font-family:'Heebo',sans-serif;font-size:.8rem;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer;}
nav button.active{background:var(--gold);border-color:var(--gold);color:#000;}
#loadingOverlay{position:fixed;inset:0;z-index:998;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
#loadingOverlay.hidden{display:none;}
.spinner{width:48px;height:48px;border:4px solid rgba(245,200,0,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.page{display:none;}.page.active{display:block;}
.content{max-width:1200px;margin:0 auto;padding:24px 16px;}
.section-title{text-align:center;font-size:1.4rem;font-weight:900;color:var(--gold);margin-bottom:18px;}
.leaderboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:24px;}
.leader-card{background:var(--card);border-radius:14px;padding:20px;text-align:center;border:2px solid #444;cursor:pointer;transition:transform .2s,border-color .2s;}
.leader-card:hover{transform:translateY(-3px);border-color:#666;}
.leader-card.rank-1{border-color:var(--gold);}
.leader-card.rank-2{border-color:#bbb;}
.leader-card.rank-3{border-color:#cd7f32;}
/* CELEBRATION BUBBLE */
.celebration-bubble {
  position:absolute;
  top:-10px;
  left:50%;
  transform:translateX(-50%) translateY(-100%);
  background:linear-gradient(135deg,#f5c800,#ff9500);
  color:#000;
  font-size:.82rem;
  font-weight:900;
  padding:8px 14px;
  border-radius:20px;
  white-space:nowrap;
  box-shadow:0 4px 20px rgba(245,200,0,0.5);
  animation:bubblePop 4s ease forwards;
  pointer-events:none;
  z-index:10;
}
.celebration-bubble::after {
  content:'';
  position:absolute;
  bottom:-7px;
  left:50%;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:8px solid transparent;
  border-right:8px solid transparent;
  border-top:8px solid #ff9500;
}
@keyframes bubblePop {
  0%   {opacity:0;transform:translateX(-50%) translateY(-110%) scale(0.6);}
  15%  {opacity:1;transform:translateX(-50%) translateY(-100%) scale(1.1);}
  25%  {transform:translateX(-50%) translateY(-100%) scale(1);}
  70%  {opacity:1;transform:translateX(-50%) translateY(-100%) scale(1);}
  100% {opacity:0;transform:translateX(-50%) translateY(-120%) scale(0.9);}
}
.leader-card{position:relative;}
.leader-card:hover{transform:translateY(-3px);}
.leader-card.rank-1{border-color:var(--gold);}.leader-card.rank-2{border-color:#bbb;}.leader-card.rank-3{border-color:#cd7f32;}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.filter-btn{background:var(--card);border:1.5px solid #444;color:var(--text);font-family:'Heebo',sans-serif;font-size:.78rem;font-weight:700;padding:5px 11px;border-radius:20px;cursor:pointer;}
.filter-btn.active,.filter-btn:hover{background:var(--red);border-color:var(--red);color:#fff;}
.match-card{background:var(--card);border-radius:12px;padding:13px 15px;margin-bottom:7px;border:1.5px solid #333;}
.match-stage{font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.match-teams{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.match-team{font-size:.92rem;font-weight:700;flex:1;}
.match-team.home{text-align:right;}.match-team.away{text-align:left;}
.match-score{background:#111;border-radius:8px;padding:5px 11px;font-size:1.05rem;font-weight:900;color:var(--gold);white-space:nowrap;min-width:60px;text-align:center;}
.match-score.upcoming{color:var(--muted);font-size:.88rem;}
.match-meta{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap;}
.match-date{font-size:.72rem;color:var(--muted);}
.locked-badge{background:rgba(192,0,10,.15);color:var(--red);font-size:.67rem;font-weight:900;padding:2px 7px;border-radius:10px;border:1px solid rgba(192,0,10,.3);}
.open-badge{background:rgba(46,204,113,.15);color:var(--green);font-size:.67rem;font-weight:900;padding:2px 7px;border-radius:10px;border:1px solid rgba(46,204,113,.3);}
.bets-header{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:16px;border:1.5px solid rgba(245,200,0,.2);}
.bets-user-row{display:flex;align-items:center;gap:12px;}
.bets-avatar{width:44px;height:44px;border-radius:50%;background:var(--gold);color:#000;font-size:1.2rem;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.score-input{width:58px;text-align:center;background:#111;border:1.5px solid #444;color:var(--text);font-family:'Heebo',sans-serif;font-size:1.2rem;font-weight:900;padding:8px 4px;border-radius:8px;}
.score-input:focus{outline:none;border-color:var(--gold);}
.submit-btn{background:linear-gradient(135deg,var(--dark-red),var(--red));color:#fff;font-family:'Heebo',sans-serif;font-size:.95rem;font-weight:900;padding:10px 22px;border:none;border-radius:8px;cursor:pointer;}
.special-bet-card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:12px;border:1.5px solid #444;}
.special-bet-title{font-size:1rem;font-weight:900;color:var(--gold);margin-bottom:12px;}
.special-input{width:100%;background:#111;border:1.5px solid #444;color:var(--text);font-family:'Heebo',sans-serif;font-size:1rem;padding:10px 14px;border-radius:10px;direction:rtl;margin-bottom:10px;}
.special-input:focus{outline:none;border-color:var(--gold);}
.form-select{width:100%;background:#111;border:1.5px solid #444;color:var(--text);font-family:'Heebo',sans-serif;font-size:.93rem;padding:10px 12px;border-radius:8px;direction:rtl;}
.explain-card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:12px;}
.explain-card h3{font-size:.98rem;color:var(--gold);margin-bottom:8px;}
.explain-card p,.explain-card li{font-size:.86rem;color:#ccc;line-height:1.7;}
.explain-card ul{padding-right:18px;}
.analysis-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
.team-card{background:var(--card);border-radius:14px;padding:15px;border:1.5px solid #333;}
.chance-bar-bg{height:5px;background:#333;border-radius:3px;margin:4px 0 10px;}
.chance-bar{height:5px;background:var(--gold);border-radius:3px;}
#profile-modal{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;}
.profile-box{background:var(--card);border-radius:16px;padding:22px;width:92%;max-width:480px;max-height:85vh;overflow-y:auto;border:1.5px solid rgba(245,200,0,.3);}
#syncIndicator{position:fixed;bottom:20px;left:20px;background:var(--green);color:#000;font-weight:900;padding:7px 14px;border-radius:20px;font-size:.82rem;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none;}
#syncIndicator.show{opacity:1;}
#toast{position:fixed;bottom:20px;right:20px;background:var(--card);color:var(--text);padding:11px 18px;border-radius:10px;font-size:.86rem;font-weight:700;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none;border:1px solid #444;max-width:270px;}
#toast.show{opacity:1;}
@media(max-width:600px){.logo-text{font-size:1.35rem;}nav button{font-size:.73rem;padding:5px 7px;}.leaderboard-grid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
